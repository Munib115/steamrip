services:
  - type: web
    name: steamrip-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
